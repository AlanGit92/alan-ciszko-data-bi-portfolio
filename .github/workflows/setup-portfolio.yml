name: Setup Portfolio Structure

on:
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un clic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Folders and Files
        run: |
          # Creamos las carpetas
          mkdir -p 01_Dashboards
          mkdir -p 02_IA_Embebida
          mkdir -p 03_ETL_Pipelines
          mkdir -p 04_SAP_Automations
          mkdir -p 05_AI_Agents_RAG
          
          # Creamos los archivos README.md con su contenido
          echo "# Dashboards Ejecutivos" > 01_Dashboards/README.md
          echo "Proyectos de Dashboards ejecutivos en Power BI..." >> 01_Dashboards/README.md
          
          echo "# IA Embebida" > 02_IA_Embebida/README.md
          echo "Integración de IA y LLMs dentro de reportes de Power BI." >> 02_IA_Embebida/README.md
          
          echo "# Pipelines ETL/ELT" > 03_ETL_Pipelines/README.md
          echo "Ingesta masiva desde SAP, automatizaciones en Python y orquestación SSIS." >> 03_ETL_Pipelines/README.md
          
          echo "# Automatización SAP" > 04_SAP_Automations/README.md
          echo "Plantillas Excel con VBA y Winshuttle para carga de datos maestros." >> 04_SAP_Automations/README.md
          
          echo "# Agentes de IA y RAG" > 05_AI_Agents_RAG/README.md
          echo "Arquitecturas de agentes autónomos y sistemas RAG." >> 05_AI_Agents_RAG/README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'AlanGit92'
          git config --global user.email 'alan.max.ciszko@gmail.com'
          git add .
          git commit -m "Automatización: Estructura inicial del portafolio creada"
          git push
